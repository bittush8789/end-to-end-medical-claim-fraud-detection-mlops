name: MLOps Pipeline

on:
  push:
    branches:
      - main
      - cicd

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[s3]

      - name: Run Pipeline (Data Ingestion & Feature Engineering)
        run: |
          python src/data_ingestion.py
          python src/feature_engineering.py

      - name: Train Models & Evaluate
        run: |
          python src/train.py
          python src/evaluate.py

      - name: Set up DVC S3 Credentials
        run: |
          dvc remote add -d -f myremote s3://diabetes-model-bucket/models
          # In a real environment, AWS credentials would be configured via aws-actions/configure-aws-credentials

      - name: Track Model with DVC
        run: |
          dvc add models/trained_model.pkl
          # dvc push (disabled in demo to prevent remote S3 upload failure without AWS credentials)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false # set to true when credentials are provided
          tags: bittush8789/medical-claim-fraud-detection:latest

      - name: Update KServe Manifest
        run: |
          # Example of modifying the image or version dynamically if needed
          echo "Updating deployment version..."

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add k8s/inference.yaml dvc.yaml.dvc || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update model and configs [skip ci]"
          # git push (configured in action settings if SSH/Auth token exists)
        continue-on-error: true
