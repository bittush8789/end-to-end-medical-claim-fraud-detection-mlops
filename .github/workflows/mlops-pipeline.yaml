name: MLOps Pipeline

on:
  push:
    branches:
      - main
      - cicd

jobs:
  setup-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash

      - name: Create Kind cluster
        run: |
          kind create cluster --name mlops-test

      - name: Add Helm repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Deploy Prometheus & Grafana
        run: |
          kubectl create namespace monitoring || true
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring
          helm upgrade --install grafana grafana/grafana \
            --namespace monitoring --set adminPassword=admin

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install

      - name: Configure DVC remote
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          dvc remote add -d s3remote s3://my-dvc-bucket/models
          dvc remote modify s3remote access_key_id $AWS_ACCESS_KEY_ID
          dvc remote modify s3remote secret_access_key $AWS_SECRET_ACCESS_KEY
          dvc remote modify s3remote region $AWS_DEFAULT_REGION

  build:
    needs: setup-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[s3]

      - name: Run Pipeline (Data Ingestion & Feature Engineering)
        run: |
          python src/data_ingestion.py
          python src/feature_engineering.py

      - name: Run Data Validation (Evidently AI)
        run: |
          python src/data_validation.py

      - name: Train Models & Evaluate (with MLflow tracking)
        run: |
          # Start a local MLflow tracking server or use mlflow API
          python src/train.py
          python src/evaluate.py

      - name: Set up DVC S3 Credentials
        run: |
          dvc remote add -d -f myremote s3://diabetes-model-bucket/models
          # In a real environment, AWS credentials would be configured via aws-actions/configure-aws-credentials

      - name: Track Model with DVC
        run: |
          dvc add models/trained_model.pkl
          # dvc push (disabled in demo to prevent remote S3 upload failure without AWS credentials)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false # set to true when credentials are provided
          tags: bittush8789/medical-claim-fraud-detection:latest

      - name: Update Helm Chart Deployment Version
        run: |
          # Dynamically set appVersion or image tag inside Helm Chart values.yaml
          sed -i "s/tag: .*/tag: \"latest\"/g" helm/medical-fraud-detection/values.yaml

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add helm/medical-fraud-detection/values.yaml dvc.yaml.dvc || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update model, Helm charts and configs [skip ci]"
          # git push (configured in action settings if SSH/Auth token exists)
        continue-on-error: true

