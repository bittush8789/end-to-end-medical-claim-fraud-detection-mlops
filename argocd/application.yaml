apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medical-claim-fraud-detection-mlops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bittush8789/end-to-end-medical-claim-fraud-detection-mlops.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: medical-fraud-detection
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
