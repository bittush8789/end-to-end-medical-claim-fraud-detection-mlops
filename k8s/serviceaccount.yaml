apiVersion: v1
kind: ServiceAccount
metadata:
  name: medical-fraud-sa
  namespace: medical-fraud-detection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: medical-fraud-kserve-rolebinding
subjects:
  - kind: ServiceAccount
    name: medical-fraud-sa
    namespace: medical-fraud-detection
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
